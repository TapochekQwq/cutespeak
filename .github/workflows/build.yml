name: Build Aliucord Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: cutespeak-aliucord

      - name: Build plugin with Gradle
        run: ./gradlew CuteSpeak:make
        working-directory: cutespeak-aliucord

      - name: Upload CuteSpeak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CuteSpeak
          path: cutespeak-aliucord/plugins/CuteSpeak/build/outputs/CuteSpeak.zip
